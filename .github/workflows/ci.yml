name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CI dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-ci.txt

      - name: Check & lint
        run: make check

      - name: Tests
        run: make test
